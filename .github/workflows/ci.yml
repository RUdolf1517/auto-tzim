name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - run: cargo build --workspace
      - name: Report lockfile for bootstrap
        run: |
          python3 -c 'import base64; print("::notice title=Lockfile::" + base64.b64encode(open("Cargo.lock", "rb").read()).decode())'
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - run: cargo test --workspace
      - name: CLI contract
        shell: bash
        run: |
          cargo build --bin auto-tzim
          target/debug/auto-tzim --help
          target/debug/auto-tzim --version
          for arg in unknown --unknown; do
            status=0
            target/debug/auto-tzim "$arg" >stdout.txt 2>stderr.txt || status=$?
            test "$status" -eq 2
            test ! -s stdout.txt
            test -s stderr.txt
          done
  deny:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
  pinned-dependencies:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-pins.py
