name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - run: cargo build --workspace --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - run: cargo test --workspace --locked
      - name: Package and install
        shell: bash
        run: |
          cargo package --locked -p auto-tzim-core
          cargo package --locked -p auto-tzim
          cargo install --locked --path crates/auto-tzim --root "$RUNNER_TEMP/auto-tzim-install"
          "$RUNNER_TEMP/auto-tzim-install/bin/auto-tzim" --version
      - name: CLI contract
        shell: bash
        run: |
          cargo build --locked --bin auto-tzim
          target/debug/auto-tzim --help
          target/debug/auto-tzim --version
          for arg in unknown --unknown; do
            status=0
            target/debug/auto-tzim "$arg" >stdout.txt 2>stderr.txt || status=$?
            test "$status" -eq 2
            test ! -s stdout.txt
            test -s stderr.txt
            printf "argument=%s exit=%s stdout=<empty> stderr:\n" "$arg" "$status"
            cat stderr.txt
          done
  deny:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        shell: bash
        run: |
          set +e
          cargo deny check 2>&1 | tee "$RUNNER_TEMP/deny-output"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'import pathlib, os; s=pathlib.Path(os.environ["RUNNER_TEMP"], "deny-output").read_text(); print("::error title=cargo-deny::" + s[-3000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
          fi
          exit "$status"
  pinned-dependencies:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-pins.py
