name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - run: cargo build --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: CLI contract
        shell: bash
        run: |
          cargo build --locked --bin auto-tzim
          target/debug/auto-tzim --help | tee "$RUNNER_TEMP/help.txt"
          target/debug/auto-tzim --version | tee "$RUNNER_TEMP/version.txt"
          for arg in unknown --unknown; do
            status=0
            target/debug/auto-tzim "$arg" >stdout.txt 2>stderr.txt || status=$?
            test "$status" -eq 2
            test ! -s stdout.txt
            test -s stderr.txt
            printf "argument=%s exit=%s stdout=<empty> stderr:\n" "$arg" "$status"
            cat stderr.txt
          done
      - name: Install CLI
        shell: bash
        run: |
          cargo install --locked --path crates/auto-tzim --root "$RUNNER_TEMP/auto-tzim-install"
          "$RUNNER_TEMP/auto-tzim-install/bin/auto-tzim" --version
      - name: Package core
        run: cargo package --locked -p auto-tzim-core
      - name: Package CLI without verification
        shell: bash
        run: |
          cargo package --locked --no-verify -p auto-tzim
          python3 -c 'import pathlib, tarfile, tomllib; p=pathlib.Path("target/package/auto-tzim-0.1.0.crate"); t=tarfile.open(p); m=tomllib.loads(t.extractfile("auto-tzim-0.1.0/Cargo.toml").read().decode()); dep=m["dependencies"]["auto-tzim-core"]; assert "path" not in dep and dep["version"] == "=0.1.0", dep'
      - name: Guard expected unpublished core failure
        shell: bash
        run: |
          set +e
          cargo package --locked -p auto-tzim > "$RUNNER_TEMP/package-output" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/package-output"
          test "$status" -ne 0
          grep -F 'no matching package named `auto-tzim-core` found' "$RUNNER_TEMP/package-output"

  deny:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1215446185352662cec6825af8e979af4006a502 # cargo-deny
      - name: cargo deny check
        shell: bash
        run: |
          set +e
          cargo deny check 2>&1 | tee "$RUNNER_TEMP/deny-output"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'import pathlib, os; s=pathlib.Path(os.environ["RUNNER_TEMP"], "deny-output").read_text(); print("::error title=cargo-deny::" + s[-3000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
          fi
          exit "$status"
  pinned-dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/test-check-pins.py
      - run: python3 scripts/check-pins.py
