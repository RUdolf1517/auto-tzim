name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - run: cargo build --workspace --locked
      - name: Record dependency features
        shell: bash
        run: |
          cargo tree --locked -e features > "$RUNNER_TEMP/dependency-tree.txt"
          cat "$RUNNER_TEMP/dependency-tree.txt"
          python3 -c 'import base64, os, pathlib; s=base64.b64encode(pathlib.Path(os.environ["RUNNER_TEMP"], "dependency-tree.txt").read_bytes()).decode(); [print(f"::notice title=FeatureTree{i//2000:03d}::{s[i:i+2000]}") for i in range(0,len(s),2000)]'
      - name: Check package metadata
        shell: bash
        run: |
          # jq is already present on GitHub runners; it validates Cargo's JSON without another project script.
          # Check the seven registry metadata fields for both workspace packages.
          cargo metadata --locked --no-deps --format-version 1 | jq -e '
            [.packages[] | select(.name == "auto-tzim" or .name == "auto-tzim-core")]
            | length == 2 and all(.[]; all(.name, .version, .edition, .license, .description, .repository, .rust_version; type == "string" and length > 0))
          '


  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Cargo tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test-output"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'import os, pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"], "test-output").read_text(); print("::error title=Test failure::" + s[-3000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
          fi
          exit "$status"
      - name: CLI contract
        shell: bash
        run: |
          cargo build --locked --bin auto-tzim
          target/debug/auto-tzim --help | tee "$RUNNER_TEMP/help.txt"
          target/debug/auto-tzim --version | tee "$RUNNER_TEMP/version.txt"
          for arg in unknown --unknown; do
            status=0
            target/debug/auto-tzim "$arg" >stdout.txt 2>stderr.txt || status=$?
            test "$status" -eq 2
            test ! -s stdout.txt
            test -s stderr.txt
            printf "argument=%s exit=%s stdout=<empty> stderr:\n" "$arg" "$status"
            cat stderr.txt
          done
      - name: Install CLI
        shell: bash
        run: |
          cargo install --locked --path crates/auto-tzim --root "$RUNNER_TEMP/auto-tzim-install"
          "$RUNNER_TEMP/auto-tzim-install/bin/auto-tzim" --version

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1215446185352662cec6825af8e979af4006a502 # cargo-deny
      - name: cargo deny check
        shell: bash
        run: |
          set +e
          cargo deny check 2>&1 | tee "$RUNNER_TEMP/deny-output"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'import pathlib, os; s=pathlib.Path(os.environ["RUNNER_TEMP"], "deny-output").read_text(); print("::error title=cargo-deny::" + s[-3000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
          fi
          exit "$status"

  pinned-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/test-check-pins.py
      - run: python3 scripts/check-pins.py
